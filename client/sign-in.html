<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In</title>

<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="css/tooplate-little-fashion.css" rel="stylesheet">
</head>

<body>

<section class="sign-in-form section-padding">
  <div class="container">
    <h1 class="text-center mb-5">Sign In</h1>

    <form id="loginForm">
      <input type="email" id="email" class="form-control mb-3" placeholder="Email" required>
      <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>

      <button class="btn btn-primary w-100">Login</button>
    </form>
  </div>
</section>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("https://plastik-backend.onrender.com/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if(res.ok){
      localStorage.setItem("token", data.token);
      alert("Login successful ✅");
      window.location.href = "index.html";
    } else {
      alert(data.message || "Login failed ❌");
    }
  } catch(err){
    alert("Server error ❌");
  }
});
</script>

</body>
</html>
