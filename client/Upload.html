<!doctype html>
<html lang="en"> 
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" rel="stylesheet">
  <title>Upload</title>
</head>

<body style="margin:20px;background:url('./images/garbage.webp');background-size:cover;display:flex;justify-content:center;align-items:center;height:100vh;">

<form id="uploadForm">
  <div class="drop-container">
    <span class="drop-title">Drop files here</span>

    <input type="file" id="imageFile" accept="image/*" required>

    <img id="previewImage" style="max-width:200px;display:none;margin-top:10px;">

    <button type="submit" id="uploadButton" class="btn btn-primary mt-3">Upload Photo</button>

    <p id="uploadMessage"></p>
    <div id="mlResultDisplay"></div>
  </div>
</form>

<script>
const fileInput = document.getElementById("imageFile");
const previewImage = document.getElementById("previewImage");
const uploadForm = document.getElementById("uploadForm");
const uploadMessage = document.getElementById("uploadMessage");
const uploadButton = document.getElementById("uploadButton");
const mlResultDisplay = document.getElementById("mlResultDisplay");

fileInput.addEventListener("change", function () {
  const file = this.files[0];
  if (file) {
    previewImage.src = URL.createObjectURL(file);
    previewImage.style.display = "block";
  }
});

uploadForm.addEventListener("submit", async function (e) {
  e.preventDefault();

  uploadMessage.textContent = "";
  mlResultDisplay.textContent = "";

  const file = fileInput.files[0];
  if (!file) return alert("Select file");

  uploadButton.disabled = true;
  uploadButton.textContent = "Uploading...";

  const formData = new FormData();
  formData.append("photo", file);

  try {
    const token = localStorage.getItem("token");

    const res = await fetch("https://plastik-backend.onrender.com/api/photos/upload", {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`
      },
      body: formData
    });

    const data = await res.json();

    if (res.ok) {
      uploadMessage.textContent = "Upload successful ✅";

      mlResultDisplay.textContent =
        `ML Result: ${data.isPlastic ? "Plastic" : "Not Plastic"} | Points: ${data.pointsAwarded}`;
    } else {
      uploadMessage.textContent = data.message || "Upload failed ❌";
    }
  } catch (err) {
    uploadMessage.textContent = "Server error ❌";
  }

  uploadButton.disabled = false;
  uploadButton.textContent = "Upload Photo";
});
</script>

</body>
</html>
