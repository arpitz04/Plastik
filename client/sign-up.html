<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sign Up</title>

<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="css/tooplate-little-fashion.css" rel="stylesheet">

</head>

<body>

<section class="sign-in-form section-padding">
  <div class="container">
    <h1 class="text-center mb-5">Sign Up</h1>

    <!-- ✅ IMPORTANT: ID ADDED -->
    <form id="registerForm">

      <input type="text" id="username" class="form-control mb-3" placeholder="Username" required>

      <input type="email" id="email" class="form-control mb-3" placeholder="Email" required>

      <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>

      <button type="submit" class="btn btn-success w-100">Register</button>

    </form>

  </div>
</section>

<!-- ✅ SCRIPT AT BOTTOM -->
<script>
document.addEventListener("DOMContentLoaded", function(){

  const form = document.getElementById("registerForm");

  form.addEventListener("submit", async function(e){
    e.preventDefault();

    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("https://plastik-backend.onrender.com/api/auth/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, email, password })
      });

      const data = await res.json();
      console.log(data);

      if(res.ok){
        alert("Registration successful ✅");
        window.location.href = "sign-in.html";
      } else {
        alert(data.message || "Registration failed ❌");
      }

    } catch(err){
      console.error(err);
      alert("Server error ❌");
    }
  });

});
</script>

</body>
</html>
